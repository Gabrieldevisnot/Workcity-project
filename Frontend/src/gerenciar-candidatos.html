<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Candidatos - WorkCity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CONFIGURAÇÃO TAILWIND DARK MODE -->
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <!-- SCRIPT DE INICIALIZAÇÃO DE TEMA -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && systemTheme)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>

    <!-- ESTILOS PARA FORÇAR VISIBILIDADE NO HEADER -->
    <style>
        #headerActions span {
            color: #111827 !important;
            font-weight: 600 !important;
        }
        #headerActions button {
            color: #111827 !important;
            font-weight: 600 !important;
            border-color: #9CA3AF !important;
        }
        .dark #headerActions span {
            color: #F3F4F6 !important;
        }
        .dark #headerActions button {
            color: #F3F4F6 !important;
            border-color: #4B5563 !important;
            background-color: rgba(31, 41, 55, 0.5);
        }
        .dark #headerActions button:hover {
            background-color: rgba(55, 65, 81, 1);
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-200">
    <div class="min-h-screen py-8">
        <div class="max-w-7xl mx-auto px-4">
            
            <!-- Header da Página -->
            <div class="mb-8">
                <div class="flex justify-between items-start mb-4">
                    <button onclick="window.location.href='empresa-dashboard.html'" class="px-4 py-2 text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition flex items-center gap-2">
                        <i class="fas fa-arrow-left"></i>
                        Voltar para Dashboard
                    </button>
                    
                    <!-- Botão de Tema (Inserido aqui também para consistência) -->
                    <div class="relative">
                        <button onclick="toggleThemeMenu()" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 transition-colors focus:outline-none">
                            <i class="fas fa-adjust text-xl"></i>
                        </button>
                        <div id="themeMenu" class="hidden absolute right-0 mt-2 w-32 bg-white dark:bg-gray-800 rounded-md shadow-lg py-1 border border-gray-200 dark:border-gray-700 z-50">
                            <button onclick="setTheme('light')" class="block w-full text-left px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700"><i class="fas fa-sun mr-2 text-orange-400"></i> Claro</button>
                            <button onclick="setTheme('dark')" class="block w-full text-left px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700"><i class="fas fa-moon mr-2 text-blue-400"></i> Escuro</button>
                            <button onclick="setTheme('system')" class="block w-full text-left px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700"><i class="fas fa-desktop mr-2 text-gray-400"></i> Sistema</button>
                        </div>
                    </div>
                </div>

                <!-- CARD DE DETALHES DA VAGA -->
                <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-6 shadow-sm mb-6 transition-colors">
                    <div class="flex justify-between items-start flex-wrap gap-4">
                        <div>
                            <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-2" id="vagaTitle">Carregando...</h1>
                            <div class="flex gap-4 text-sm text-gray-600 dark:text-gray-400 mb-2">
                                <span id="vagaLocal"><i class="fas fa-map-marker-alt mr-1"></i> ...</span>
                                <span id="vagaSalario"><i class="fas fa-dollar-sign mr-1"></i> ...</span>
                                <span id="vagaEspecialidade" class="capitalize"><i class="fas fa-tools mr-1"></i> ...</span>
                            </div>
                            <p class="text-gray-500 dark:text-gray-400 text-sm max-w-3xl" id="vagaDescricao">...</p>
                        </div>
                        
                        <!-- Filtro de Ordenação -->
                        <div class="w-64">
                            <label class="text-xs text-gray-500 dark:text-gray-400 uppercase font-bold">Ordenar Candidatos</label>
                            <select id="ordenacaoSelect" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md mt-1 text-sm bg-white dark:bg-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-orange-500 outline-none">
                                <option value="data-desc">📅 Mais Recente</option>
                                <option value="data-asc">Mais Antigo</option>
                                <option value="rating-desc">⭐ Maior Avaliação</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Estatísticas -->
            <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">
                <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm p-4 text-center">
                    <div class="text-2xl font-bold text-gray-900 dark:text-white" id="statTotal">0</div>
                    <div class="text-sm text-gray-600 dark:text-gray-400">Total</div>
                </div>
                <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm p-4 text-center">
                    <div class="text-2xl font-bold text-gray-500 dark:text-gray-400" id="statPendente">0</div>
                    <div class="text-sm text-gray-600 dark:text-gray-400">Pendentes</div>
                </div>
                <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm p-4 text-center">
                    <div class="text-2xl font-bold text-green-500" id="statAceito">0</div>
                    <div class="text-sm text-gray-600 dark:text-gray-400">Aceitos</div>
                </div>
                <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm p-4 text-center">
                    <div class="text-2xl font-bold text-red-500" id="statRecusado">0</div>
                    <div class="text-sm text-gray-600 dark:text-gray-400">Recusados</div>
                </div>
                <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm p-4 text-center">
                    <div class="text-2xl font-bold text-purple-500" id="statContratado">0</div>
                    <div class="text-sm text-gray-600 dark:text-gray-400">Contratados</div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm mb-6 border-b border-gray-200 dark:border-gray-700 transition-colors">
                <nav class="flex -mb-px flex-wrap">
                    <button onclick="switchFilter('todos')" id="tabTodos" class="px-4 py-3 border-b-2 border-orange-500 text-orange-500 font-medium text-sm transition-colors">
                        Todos (<span id="countTodos">0</span>)
                    </button>
                    <button onclick="switchFilter('pendente')" id="tabPendente" class="px-4 py-3 border-b-2 border-transparent text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white font-medium text-sm transition-colors">
                        Pendentes (<span id="countPendente">0</span>)
                    </button>
                    <button onclick="switchFilter('aceito')" id="tabAceito" class="px-4 py-3 border-b-2 border-transparent text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white font-medium text-sm transition-colors">
                        Aceitos (<span id="countAceito">0</span>)
                    </button>
                    <button onclick="switchFilter('recusado')" id="tabRecusado" class="px-4 py-3 border-b-2 border-transparent text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white font-medium text-sm transition-colors">
                        Recusados (<span id="countRecusado">0</span>)
                    </button>
                    <button onclick="switchFilter('contratado')" id="tabContratado" class="px-4 py-3 border-b-2 border-transparent text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white font-medium text-sm transition-colors">
                        Contratados (<span id="countContratados">0</span>)
                    </button>
                </nav>
            </div>

            <!-- Lista de Candidatos -->
            <div id="candidatosList" class="space-y-4">
                <div class="text-center py-12 text-gray-500 dark:text-gray-400">Carregando...</div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="scripts/auth.js"></script>
    <script src="scripts/main.js"></script>
    
    <script>
        // --- LÓGICA DE TEMA ---
        function toggleThemeMenu() { document.getElementById('themeMenu').classList.toggle('hidden'); }
        function setTheme(theme) {
            const root = document.documentElement;
            if (theme === 'system') {
                localStorage.removeItem('theme');
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) root.classList.add('dark');
                else root.classList.remove('dark');
            } else {
                localStorage.setItem('theme', theme);
                if (theme === 'dark') root.classList.add('dark');
                else root.classList.remove('dark');
            }
            document.getElementById('themeMenu').classList.add('hidden');
        }
        window.addEventListener('click', function(e) {
            const btn = document.querySelector('button[onclick="toggleThemeMenu()"]');
            const menu = document.getElementById('themeMenu');
            if (!btn.contains(e.target) && !menu.contains(e.target)) menu.classList.add('hidden');
        });

        requireAuth('empresa');

        let listaCandidatosGlobal = [];
        let currentFilter = 'todos';
        const urlParams = new URLSearchParams(window.location.search);
        const vagaId = urlParams.get('id');

        if (!vagaId) {
            alert("Vaga não encontrada.");
            window.location.href = 'empresa-dashboard.html';
        }

        async function carregarDetalhesVaga() {
            const token = JSON.parse(localStorage.getItem('token'));
            try {
                const response = await fetch(`${API_URL}/vagas/${vagaId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const vaga = await response.json();

                if (response.ok) {
                    document.getElementById('vagaTitle').textContent = vaga.titulo;
                    document.getElementById('vagaLocal').innerHTML = `<i class="fas fa-map-marker-alt mr-1"></i> ${vaga.localizacao}`;
                    document.getElementById('vagaSalario').innerHTML = `<i class="fas fa-dollar-sign mr-1"></i> ${vaga.salario_min ? `R$ ${vaga.salario_min}` : 'A combinar'}`;
                    document.getElementById('vagaEspecialidade').innerHTML = `<i class="fas fa-tools mr-1"></i> ${vaga.especialidade || 'Geral'}`;
                    document.getElementById('vagaDescricao').textContent = vaga.descricao;
                } else {
                    document.getElementById('vagaTitle').textContent = "Erro ao carregar vaga";
                }
            } catch (error) {
                console.error("Erro vaga:", error);
            }
        }

        async function carregarCandidatos() {
            const token = JSON.parse(localStorage.getItem('token'));
            const container = document.getElementById('candidatosList');

            try {
                const response = await fetch(`${API_URL}/vagas/${vagaId}/candidatos`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const dados = await response.json();

                if (!Array.isArray(dados)) throw new Error("Erro ao buscar dados");

                listaCandidatosGlobal = dados;
                renderCandidatos();

            } catch (error) {
                console.error(error);
                container.innerHTML = '<p class="text-center text-red-500 dark:text-red-400">Erro ao carregar candidatos.</p>';
            }
        }

        function switchFilter(filter) {
            currentFilter = filter;
            const tabs = ['todos', 'pendente', 'aceito', 'recusado', 'contratado'];
            tabs.forEach(tab => {
                const btn = document.getElementById(`tab${tab.charAt(0).toUpperCase() + tab.slice(1)}`);
                if(btn) {
                    btn.className = tab === filter 
                        ? 'px-4 py-3 border-b-2 border-orange-500 text-orange-500 font-medium text-sm transition-colors' 
                        : 'px-4 py-3 border-b-2 border-transparent text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white font-medium text-sm transition-colors';
                }
            });
            renderCandidatos();
        }

        async function atualizarStatus(candidaturaId, novoStatus) {
            const token = JSON.parse(localStorage.getItem('token'));
            if (!confirm('Confirmar alteração de status?')) return;

            try {
                const response = await fetch(`${API_URL}/candidaturas/${candidaturaId}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ status: novoStatus })
                });

                if (response.ok) {
                    const candidato = listaCandidatosGlobal.find(c => c.candidatura_id == candidaturaId);
                    if (candidato) candidato.status = novoStatus;
                    renderCandidatos();
                } else {
                    alert('Erro ao atualizar status.');
                }
            } catch (error) {
                alert('Erro de conexão.');
            }
        }

        function renderCandidatos() {
            const container = document.getElementById('candidatosList');
            const ordenacao = document.getElementById('ordenacaoSelect').value;
            
            let candidatosParaExibir = [...listaCandidatosGlobal];

            candidatosParaExibir.sort((a, b) => {
                const dataA = new Date(a.data_candidatura).getTime();
                const dataB = new Date(b.data_candidatura).getTime();
                if (ordenacao === 'data-desc') return dataB - dataA;
                if (ordenacao === 'data-asc') return dataA - dataB;
                return 0;
            });
            
            const stats = {
                todos: listaCandidatosGlobal.length,
                pendente: listaCandidatosGlobal.filter(c => c.status === 'pendente').length,
                aceito: listaCandidatosGlobal.filter(c => c.status === 'aceito').length,
                recusado: listaCandidatosGlobal.filter(c => c.status === 'rejeitado' || c.status === 'recusado').length,
                contratado: listaCandidatosGlobal.filter(c => c.status === 'contratado').length
            };

            document.getElementById('statTotal').textContent = stats.todos;
            document.getElementById('statPendente').textContent = stats.pendente;
            document.getElementById('statAceito').textContent = stats.aceito;
            document.getElementById('statRecusado').textContent = stats.recusado;
            document.getElementById('statContratado').textContent = stats.contratado;

            document.getElementById('countTodos').textContent = stats.todos;
            document.getElementById('countPendente').textContent = stats.pendente;
            document.getElementById('countAceito').textContent = stats.aceito;
            document.getElementById('countRecusado').textContent = stats.recusado;
            document.getElementById('countContratados').textContent = stats.contratado;

            if (currentFilter !== 'todos') {
                if (currentFilter === 'recusado') {
                    candidatosParaExibir = candidatosParaExibir.filter(c => c.status === 'rejeitado' || c.status === 'recusado');
                } else {
                    candidatosParaExibir = candidatosParaExibir.filter(c => c.status === currentFilter);
                }
            }
            
            if (candidatosParaExibir.length === 0) {
                container.innerHTML = `<div class="bg-white dark:bg-gray-800 rounded-lg p-12 text-center border border-gray-200 dark:border-gray-700"><i class="fas fa-users text-gray-300 dark:text-gray-600 text-6xl mb-4"></i><h3 class="text-gray-900 dark:text-white mb-2">Nenhum candidato encontrado</h3></div>`;
                return;
            }
            
            container.innerHTML = candidatosParaExibir.map(c => {
                const statusNormalizado = c.status === 'rejeitado' ? 'recusado' : c.status;
                const statusClasses = { 
                    'pendente': 'bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-200', 
                    'aceito': 'bg-green-100 dark:bg-green-900/50 text-green-800 dark:text-green-200', 
                    'recusado': 'bg-red-100 dark:bg-red-900/50 text-red-800 dark:text-red-200', 
                    'contratado': 'bg-purple-100 dark:bg-purple-900/50 text-purple-800 dark:text-purple-200' 
                };

                return `
                    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm p-6 mb-4 border border-gray-100 dark:border-gray-700 hover:shadow-md transition-shadow">
                        <div class="flex flex-col md:flex-row justify-between md:items-start gap-4">
                            <div class="flex items-start gap-4 flex-1">
                                <div class="w-12 h-12 bg-orange-100 dark:bg-orange-900/30 rounded-full flex items-center justify-center text-orange-600 dark:text-orange-400 font-bold text-lg shrink-0">
                                    ${c.nome_profissional.charAt(0)}
                                </div>
                                <div class="flex-1">
                                    <div class="flex items-center gap-3 mb-2 flex-wrap">
                                        <h3 class="text-lg font-semibold text-gray-900 dark:text-white">${c.nome_profissional}</h3>
                                        <span class="px-2 py-0.5 rounded-full text-xs font-bold uppercase tracking-wide ${statusClasses[statusNormalizado] || 'bg-gray-100'}">${statusNormalizado}</span>
                                    </div>
                                    <p class="text-gray-600 dark:text-gray-400 mb-2 font-medium">${c.especialidade || 'Profissional'} • ${c.experience_years || 0} anos xp</p>
                                    <div class="flex items-center gap-4 text-sm text-gray-600 dark:text-gray-400 mb-3 flex-wrap">
                                        <span><i class="fas fa-phone text-gray-400 mr-1"></i> ${c.phone}</span>
                                        <span><i class="fas fa-envelope text-gray-400 mr-1"></i> ${c.email}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="flex flex-col gap-2 min-w-[140px]">
                                ${c.status === 'pendente' ? `
                                    <button onclick="atualizarStatus(${c.candidatura_id}, 'aceito')" class="w-full px-3 py-2 bg-green-500 hover:bg-green-600 text-white rounded transition text-sm flex items-center justify-center gap-2"><i class="fas fa-check"></i> Aprovar</button>
                                    <button onclick="atualizarStatus(${c.candidatura_id}, 'recusado')" class="w-full px-3 py-2 border border-red-300 dark:border-red-500 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 rounded transition text-sm flex items-center justify-center gap-2"><i class="fas fa-times"></i> Recusar</button>
                                ` : ''}
                                ${c.status === 'aceito' ? `
                                    <button onclick="atualizarStatus(${c.candidatura_id}, 'contratado')" class="w-full px-3 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded transition text-sm flex items-center justify-center gap-2"><i class="fas fa-handshake"></i> Contratar</button>
                                    <button onclick="atualizarStatus(${c.candidatura_id}, 'pendente')" class="w-full text-gray-400 text-xs hover:text-gray-600 mt-1">Desfazer</button>
                                ` : ''}
                                ${(c.status === 'recusado' || c.status === 'rejeitado') ? `
                                    <span class="text-red-500 text-sm text-center italic">Rejeitada</span>
                                    <button onclick="atualizarStatus(${c.candidatura_id}, 'pendente')" class="w-full text-gray-400 text-xs hover:text-gray-600 mt-1">Reconsiderar</button>
                                ` : ''}
                                ${c.status === 'contratado' ? `<div class="bg-purple-50 dark:bg-purple-900/30 text-purple-700 dark:text-purple-300 p-2 rounded text-center text-sm font-bold border border-purple-200 dark:border-purple-800"><i class="fas fa-check-circle"></i> Contratado</div>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        carregarDetalhesVaga(); 
        carregarCandidatos();   
    </script>
</body>
</html>
