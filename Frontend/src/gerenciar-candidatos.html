<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Candidatos - WorkCity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <div class="min-h-screen py-8">
        <div class="max-w-7xl mx-auto px-4">
            <div class="mb-6">
                <button onclick="window.location.href='empresa-dashboard.html'" class="px-4 py-2 text-gray-600 hover:text-gray-900 transition flex items-center gap-2 mb-4">
                    <i class="fas fa-arrow-left"></i>
                    Voltar para Dashboard
                </button>
                <div class="flex items-center justify-between flex-wrap gap-4">
                    <div>
                        <h1 class="text-3xl font-bold text-gray-900 mb-2" id="vagaTitle">Carregando vaga...</h1>
                        <p class="text-gray-600">Gerencie os candidatos que se interessaram pela sua vaga</p>
                    </div>
                    <div class="w-64">
                        <select id="ordenacaoSelect" class="w-full px-4 py-2 border border-gray-300 rounded-md">
                            <option value="data-desc">📅 Mais Recente</option>
                            <option value="data-asc">Mais Antigo</option>
                            <option value="rating-desc">⭐ Maior Avaliação</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">
                <div class="bg-white rounded-lg shadow-sm p-4 text-center">
                    <div class="text-2xl font-bold text-gray-900" id="statTotal">0</div>
                    <div class="text-sm text-gray-600">Total</div>
                </div>
                <div class="bg-white rounded-lg shadow-sm p-4 text-center">
                    <div class="text-2xl font-bold text-gray-500" id="statPendente">0</div>
                    <div class="text-sm text-gray-600">Pendentes</div>
                </div>
                <div class="bg-white rounded-lg shadow-sm p-4 text-center">
                    <div class="text-2xl font-bold text-green-500" id="statAceito">0</div>
                    <div class="text-sm text-gray-600">Aceitos</div>
                </div>
                <div class="bg-white rounded-lg shadow-sm p-4 text-center">
                    <div class="text-2xl font-bold text-red-500" id="statRecusado">0</div>
                    <div class="text-sm text-gray-600">Recusados</div>
                </div>
                <div class="bg-white rounded-lg shadow-sm p-4 text-center">
                    <div class="text-2xl font-bold text-purple-500" id="statContratado">0</div>
                    <div class="text-sm text-gray-600">Contratados</div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-sm mb-6">
                <div class="border-b border-gray-200">
                    <nav class="flex -mb-px flex-wrap">
                        <button onclick="switchFilter('todos')" id="tabTodos" class="px-4 py-3 border-b-2 border-orange-500 text-orange-500 font-medium text-sm">
                            Todos (<span id="countTodos">0</span>)
                        </button>
                        <button onclick="switchFilter('pendente')" id="tabPendente" class="px-4 py-3 border-b-2 border-transparent text-gray-600 hover:text-gray-900 font-medium text-sm">
                            Pendentes (<span id="countPendente">0</span>)
                        </button>
                        <button onclick="switchFilter('aceito')" id="tabAceito" class="px-4 py-3 border-b-2 border-transparent text-gray-600 hover:text-gray-900 font-medium text-sm">
                            Aceitos (<span id="countAceito">0</span>)
                        </button>
                        <button onclick="switchFilter('recusado')" id="tabRecusado" class="px-4 py-3 border-b-2 border-transparent text-gray-600 hover:text-gray-900 font-medium text-sm">
                            Recusados (<span id="countRecusado">0</span>)
                        </button>
                        <button onclick="switchFilter('contratado')" id="tabContratado" class="px-4 py-3 border-b-2 border-transparent text-gray-600 hover:text-gray-900 font-medium text-sm">
                            Contratados (<span id="countContratados">0</span>)
                        </button>
                    </nav>
                </div>
            </div>

            <div id="candidatosList" class="space-y-4">
                <div class="text-center py-12 text-gray-500">Carregando...</div>
            </div>
        </div>
    </div>

    <script src="scripts/auth.js"></script>
    <script src="scripts/main.js"></script>
    
    <script>
        // 1. Configuração Inicial
        requireAuth('empresa');

        // Variáveis globais
        let listaCandidatosGlobal = []; // Armazena os dados que vêm do banco
        let currentFilter = 'todos';

        // Obter ID da vaga da URL
        const urlParams = new URLSearchParams(window.location.search);
        const vagaId = urlParams.get('id');

        if (!vagaId) {
            alert("Vaga não encontrada.");
            window.location.href = 'empresa-dashboard.html';
        }

        // 2. FUNÇÃO PRINCIPAL: BUSCAR DO BANCO
        async function carregarDados() {
            const token = JSON.parse(localStorage.getItem('token'));
            const container = document.getElementById('candidatosList');

            try {
                // A rota que criamos no server.js
                const response = await fetch(`${API_URL}/vagas/${vagaId}/candidatos`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const dados = await response.json();

                if (!Array.isArray(dados)) throw new Error("Erro ao buscar dados");

                listaCandidatosGlobal = dados; // Salva na memória para filtrar/ordenar sem ir no server de novo

                // Atualiza título (Se houver candidatos, pega o nome da vaga do primeiro, senão mantém genérico)
                /* Nota: O ideal seria uma rota só pra pegar detalhes da vaga, mas vamos simplificar */
                if (dados.length > 0) {
                    // Como não temos o título da vaga no endpoint de candidatos, deixaremos genérico ou você pode criar uma rota GET /vagas/:id
                    document.getElementById('vagaTitle').textContent = `Gerenciar Candidatura (ID: ${vagaId})`; 
                } else {
                    document.getElementById('vagaTitle').textContent = `Vaga ID: ${vagaId}`;
                }

                renderCandidatos();

            } catch (error) {
                console.error(error);
                container.innerHTML = '<p class="text-center text-red-500">Erro ao carregar candidatos.</p>';
            }
        }

        // 3. ALTERAR FILTRO (Tabs)
        function switchFilter(filter) {
            currentFilter = filter;
            
            // Atualiza visual das abas
            const tabs = ['todos', 'pendente', 'aceito', 'recusado', 'contratado'];
            tabs.forEach(tab => {
                const btn = document.getElementById(`tab${tab.charAt(0).toUpperCase() + tab.slice(1)}`);
                if (btn) {
                    btn.className = tab === filter
                        ? 'px-4 py-3 border-b-2 border-orange-500 text-orange-500 font-medium text-sm'
                        : 'px-4 py-3 border-b-2 border-transparent text-gray-600 hover:text-gray-900 font-medium text-sm';
                }
            });
            
            renderCandidatos();
        }

        // 4. ATUALIZAR STATUS (Envia para o Backend)
        async function atualizarStatus(candidaturaId, novoStatus) {
            const token = JSON.parse(localStorage.getItem('token'));
            
            const messages = {
                'aceito': 'Deseja APROVAR este candidato?',
                'recusado': 'Deseja REJEITAR este candidato?',
                'contratado': 'Deseja marcar como CONTRATADO?',
                'pendente': 'Deseja voltar para pendente?'
            };

            if (!confirm(messages[novoStatus] || 'Confirmar alteração?')) return;

            try {
                const response = await fetch(`${API_URL}/candidaturas/${candidaturaId}/status`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ status: novoStatus })
                });

                if (response.ok) {
                    // Atualiza localmente para não precisar recarregar tudo
                    const candidato = listaCandidatosGlobal.find(c => c.candidatura_id == candidaturaId);
                    if (candidato) candidato.status = novoStatus;
                    
                    showToast(`Status atualizado para: ${novoStatus.toUpperCase()}`, 'success');
                    renderCandidatos();
                } else {
                    alert('Erro ao atualizar status.');
                }
            } catch (error) {
                console.error(error);
                alert('Erro de conexão.');
            }
        }

        // 5. RENDERIZAR NA TELA (Onde a mágica visual acontece)
        function renderCandidatos() {
            const container = document.getElementById('candidatosList');
            const ordenacao = document.getElementById('ordenacaoSelect').value;
            
            // Clona a lista para não estragar a original
            let candidatosParaExibir = [...listaCandidatosGlobal];

            // A. Ordenação
            candidatosParaExibir.sort((a, b) => {
                const dataA = new Date(a.data_candidatura).getTime();
                const dataB = new Date(b.data_candidatura).getTime();
                
                // Nota: Rating é fake por enquanto, então ordenamos por data
                if (ordenacao === 'data-desc') return dataB - dataA;
                if (ordenacao === 'data-asc') return dataA - dataB;
                return 0;
            });
            
            // B. Filtros de Status
            const stats = {
                todos: listaCandidatosGlobal.length,
                pendente: listaCandidatosGlobal.filter(c => c.status === 'pendente').length,
                aceito: listaCandidatosGlobal.filter(c => c.status === 'aceito').length,
                recusado: listaCandidatosGlobal.filter(c => c.status === 'rejeitado' || c.status === 'recusado').length,
                contratado: listaCandidatosGlobal.filter(c => c.status === 'contratado').length
            };

            // Atualiza os números no topo da página
            document.getElementById('statTotal').textContent = stats.todos;
            document.getElementById('statPendente').textContent = stats.pendente;
            document.getElementById('statAceito').textContent = stats.aceito;
            document.getElementById('statRecusado').textContent = stats.recusado;
            document.getElementById('statContratado').textContent = stats.contratado;

            document.getElementById('countTodos').textContent = stats.todos;
            document.getElementById('countPendente').textContent = stats.pendente;
            document.getElementById('countAceito').textContent = stats.aceito;
            document.getElementById('countRecusado').textContent = stats.recusado;
            document.getElementById('countContratados').textContent = stats.contratado;

            // Filtra a lista para exibição
            if (currentFilter !== 'todos') {
                // Tratamento especial para "recusado" que no banco pode estar como "rejeitado"
                if (currentFilter === 'recusado') {
                    candidatosParaExibir = candidatosParaExibir.filter(c => c.status === 'rejeitado' || c.status === 'recusado');
                } else {
                    candidatosParaExibir = candidatosParaExibir.filter(c => c.status === currentFilter);
                }
            }
            
            // C. HTML (Vazio)
            if (candidatosParaExibir.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-lg p-12 text-center border border-gray-200">
                        <i class="fas fa-users text-gray-300 text-6xl mb-4"></i>
                        <h3 class="text-gray-900 mb-2">Nenhum candidato nesta categoria</h3>
                        <p class="text-gray-600">Aguarde novas candidaturas ou mude o filtro.</p>
                    </div>
                `;
                return;
            }
            
            // D. HTML (Lista)
            container.innerHTML = candidatosParaExibir.map(c => {
                // Normaliza status para cores
                const statusNormalizado = c.status === 'rejeitado' ? 'recusado' : c.status;
                
                const statusClasses = {
                    'pendente': 'bg-gray-100 text-gray-800',
                    'aceito': 'bg-green-100 text-green-800',
                    'recusado': 'bg-red-100 text-red-800',
                    'contratado': 'bg-purple-100 text-purple-800'
                };

                return `
                    <div class="bg-white rounded-lg shadow-sm p-6 mb-4 border border-gray-100 hover:shadow-md transition-shadow">
                        <div class="flex flex-col md:flex-row justify-between md:items-start gap-4">
                            
                            <div class="flex items-start gap-4 flex-1">
                                <div class="w-16 h-16 bg-orange-100 rounded-full flex items-center justify-center text-orange-600 font-bold text-xl shrink-0">
                                    ${c.nome_profissional.charAt(0)}
                                </div>
                                
                                <div class="flex-1">
                                    <div class="flex items-center gap-3 mb-2 flex-wrap">
                                        <h3 class="text-lg font-semibold text-gray-900">${c.nome_profissional}</h3>
                                        <span class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide ${statusClasses[statusNormalizado] || 'bg-gray-100'}">
                                            ${statusNormalizado}
                                        </span>
                                    </div>
                                    
                                    <p class="text-gray-600 mb-2 font-medium">${c.especialidade || 'Profissional'} • ${c.experience_years || 0} anos de exp.</p>
                                    
                                    <div class="flex items-center gap-4 text-sm text-gray-600 mb-3 flex-wrap">
                                        <span><i class="fas fa-map-marker-alt text-gray-400 mr-1"></i> ${c.city || 'Não informado'}</span>
                                        <span><i class="fas fa-phone text-gray-400 mr-1"></i> ${c.phone}</span>
                                        <span><i class="fas fa-envelope text-gray-400 mr-1"></i> ${c.email}</span>
                                    </div>

                                    <div class="bg-gray-50 rounded-lg p-3 mb-3 text-sm text-gray-600">
                                        <p><strong>Data da candidatura:</strong> ${new Date(c.data_candidatura).toLocaleDateString('pt-BR')}</p>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="flex flex-col gap-2 min-w-[150px]">
                                ${c.status === 'pendente' ? `
                                    <button onclick="atualizarStatus(${c.candidatura_id}, 'aceito')" class="w-full px-4 py-2 bg-green-500 hover:bg-green-600 text-white rounded-md transition text-sm flex items-center justify-center gap-2">
                                        <i class="fas fa-check"></i> Aprovar
                                    </button>
                                    <button onclick="atualizarStatus(${c.candidatura_id}, 'recusado')" class="w-full px-4 py-2 border border-red-300 text-red-600 hover:bg-red-50 rounded-md transition text-sm flex items-center justify-center gap-2">
                                        <i class="fas fa-times"></i> Recusar
                                    </button>
                                ` : ''}

                                ${c.status === 'aceito' ? `
                                    <button onclick="atualizarStatus(${c.candidatura_id}, 'contratado')" class="w-full px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-md transition text-sm flex items-center justify-center gap-2">
                                        <i class="fas fa-handshake"></i> Contratar
                                    </button>
                                    <button onclick="atualizarStatus(${c.candidatura_id}, 'pendente')" class="w-full text-gray-400 text-xs hover:text-gray-600 mt-2">
                                        Desfazer
                                    </button>
                                ` : ''}

                                ${(c.status === 'recusado' || c.status === 'rejeitado') ? `
                                    <span class="text-red-500 text-sm text-center italic">Candidatura rejeitada</span>
                                    <button onclick="atualizarStatus(${c.candidatura_id}, 'pendente')" class="w-full text-gray-400 text-xs hover:text-gray-600 mt-1">
                                        Reconsiderar
                                    </button>
                                ` : ''}

                                ${c.status === 'contratado' ? `
                                    <div class="bg-purple-50 text-purple-700 p-2 rounded text-center text-sm font-bold border border-purple-200">
                                        <i class="fas fa-check-circle"></i> Contratado
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Event listener de ordenação
        document.getElementById('ordenacaoSelect').addEventListener('change', renderCandidatos);

        // Função de Toast (Visual)
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-4 right-4 px-6 py-3 rounded-lg text-white shadow-lg transform transition-all duration-300 translate-y-10 opacity-0 z-50 ${type === 'success' ? 'bg-green-600' : 'bg-red-600'}`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} mr-2"></i> ${message}`;
            document.body.appendChild(toast);

            // Animação de entrada
            setTimeout(() => {
                toast.classList.remove('translate-y-10', 'opacity-0');
            }, 100);

            // Remove depois de 3s
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Start
        carregarDados();
    </script>
</body>
</html>
