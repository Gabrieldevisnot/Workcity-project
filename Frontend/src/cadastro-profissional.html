<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Profissional - WorkCity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles/main.css">

    <script>tailwind.config = { darkMode: 'class' }</script>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && systemTheme)) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
        })();
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-200 py-12 px-4">
    
    <!-- Botão Voltar (Absolute) -->
    <a href="index.html" class="absolute top-6 left-6 text-gray-600 dark:text-gray-400 hover:text-orange-500 transition flex items-center gap-2">
        <i class="fas fa-arrow-left"></i> Home
    </a>

    <!-- Botão Tema (Absolute) -->
    <div class="absolute top-6 right-6">
        <button onclick="toggleTheme()" class="p-2 rounded-full bg-white dark:bg-gray-800 shadow-sm text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
            <i class="fas fa-adjust"></i>
        </button>
    </div>

    <div class="max-w-3xl mx-auto mt-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Cadastro de Profissional</h1>
            <p class="text-gray-600 dark:text-gray-400 mt-2">Crie sua conta e encontre oportunidades.</p>
        </div>

        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-8 border border-gray-200 dark:border-gray-700 transition-colors">
            <form id="cadastroForm" class="space-y-6">
                
                <!-- Dados Pessoais -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Nome Completo *</label>
                        <input type="text" id="nome" required class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-orange-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">CPF *</label>
                        <input type="text" id="cpf" required placeholder="000.000.000-00" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-orange-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">E-mail *</label>
                        <input type="email" id="email" required class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-orange-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Telefone *</label>
                        <input type="tel" id="telefone" required placeholder="(00) 00000-0000" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-orange-500 outline-none">
                    </div>
                </div>

                <!-- Dados Profissionais -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Especialidade *</label>
                        <select id="especialidade" required class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-orange-500 outline-none">
                            <option value="">Selecione...</option>
                            <option value="pedreiro">Pedreiro</option>
                            <option value="eletricista">Eletricista</option>
                            <option value="pintor">Pintor</option>
                            <option value="encanador">Encanador</option>
                            <option value="carpinteiro">Carpinteiro</option>
                            <option value="serralheiro">Serralheiro</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Experiência (anos) *</label>
                        <input type="number" id="experiencia" required min="0" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-orange-500 outline-none">
                    </div>
                </div>

                <!-- Localização IBGE -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Estado *</label>
                        <select id="ufCadastro" required class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-orange-500 outline-none" onchange="carregarCidades('ufCadastro', 'listaCidadesCadastro', 'cidadeCadastro')">
                            <option value="">UF</option>
                        </select>
                    </div>
                    <div class="md:col-span-2 relative">
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Cidade *</label>
                        <input type="text" id="cidadeCadastro" list="listaCidadesCadastro" required disabled placeholder="Selecione o Estado..." class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md dark:bg-gray-700 dark:text-white disabled:bg-gray-100 dark:disabled:bg-gray-800 focus:ring-2 focus:ring-orange-500 outline-none">
                        <datalist id="listaCidadesCadastro"></datalist>
                    </div>
                </div>

                <!-- Senha -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 border-t border-gray-200 dark:border-gray-600 pt-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Senha *</label>
                        <input type="password" id="password" required class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-orange-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Confirmar Senha *</label>
                        <input type="password" id="confirmPassword" required class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-orange-500 outline-none">
                    </div>
                </div>

                <div class="flex items-start">
                    <input type="checkbox" id="terms" required class="h-4 w-4 text-orange-500 mt-1 border-gray-300 rounded focus:ring-orange-500">
                    <label for="terms" class="ml-2 text-sm text-gray-600 dark:text-gray-400">
                        Aceito os <a href="#" class="text-orange-500 hover:text-orange-600">termos de uso</a> e <a href="#" class="text-orange-500 hover:text-orange-600">política de privacidade</a>
                    </label>
                </div>

                <button type="submit" class="w-full py-3 bg-orange-500 hover:bg-orange-600 text-white rounded-md font-bold transition shadow-md">
                    Criar Conta
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-gray-600 dark:text-gray-400">
                    Já tem uma conta? <a href="login-profissional.html" class="text-orange-600 dark:text-orange-400 font-medium hover:underline">Faça login</a>
                </p>
            </div>
        </div>
    </div>

    <script src="scripts/auth.js"></script>
    <script src="scripts/ibge.js"></script>
    <script src="scripts/main.js"></script> 
    <script>
        function toggleTheme() {
            const root = document.documentElement;
            if (root.classList.contains('dark')) {
                root.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                root.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        // Iniciar IBGE
        document.addEventListener('DOMContentLoaded', () => {
            carregarEstados('ufCadastro');
        });

        document.getElementById('cadastroForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                alert('As senhas não coincidem');
                return;
            }
            
            const userData = {
                nome: document.getElementById('nome').value,
                cpf: document.getElementById('cpf').value,
                email: document.getElementById('email').value,
                telefone: document.getElementById('telefone').value,
                especialidade: document.getElementById('especialidade').value,
                experiencia: document.getElementById('experiencia').value,
                cidade: document.getElementById('cidadeCadastro').value,
                password: password,
                cadastroDate: new Date().toISOString()
            };
            
            registerUser('profissional', userData);
        });
    </script>
</body>
</html>
