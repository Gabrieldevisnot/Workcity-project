<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Empresa - WorkCity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <div class="min-h-screen py-12 px-4">
        <div class="max-w-2xl mx-auto">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-900">Cadastro de Empresa</h1>
                <p class="text-gray-600 mt-2">Preencha os dados da sua empresa</p>
            </div>

            <div class="bg-white rounded-lg shadow-md p-8">
                <form id="cadastroForm" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Razão Social *</label>
                        <input type="text" id="razaoSocial" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-orange-500">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">CNPJ *</label>
                            <input type="text" id="cnpj" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-orange-500" placeholder="00.000.000/0000-00">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Telefone *</label>
                            <input type="tel" id="telefone" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-orange-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">E-mail Corporativo *</label>
                        <input type="email" id="email" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-orange-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Endereço Completo *</label>
                        <input type="text" id="endereco" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-orange-500">
                    </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Estado *</label>
                        <select id="ufCadastro" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-orange-500"
                            onchange="carregarCidades('ufCadastro', 'listaCidadesCadastro', 'cidadeCadastro')">
                            <option value="">Selecione...</option>
                        </select>
                    </div>
                
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Cidade *</label>
                        <div class="relative">
                            <input type="text" id="cidadeCadastro" list="listaCidadesCadastro"
                                required 
                                disabled
                                placeholder="Selecione o Estado primeiro..."
                                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-orange-500 bg-gray-50 disabled:cursor-not-allowed">
                            <datalist id="listaCidadesCadastro"></datalist>
                        </div>
                    </div>
                </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Senha *</label>
                            <input type="password" id="password" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-orange-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Confirmar Senha *</label>
                            <input type="password" id="confirmPassword" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-orange-500">
                        </div>
                    </div>

                    <div class="flex items-start">
                        <input type="checkbox" id="terms" required class="h-4 w-4 text-orange-500 mt-1">
                        <label for="terms" class="ml-2 text-sm text-gray-600">
                            Aceito os <a href="#" class="text-orange-500">termos de uso</a> e <a href="#" class="text-orange-500">política de privacidade</a>
                        </label>
                    </div>

                    <button type="submit" class="w-full py-3 bg-orange-500 hover:bg-orange-600 text-white rounded-md font-medium transition">
                        Criar Conta
                    </button>
                </form>

                <div class="mt-6 text-center">
                    <p class="text-gray-600">
                        Já tem uma conta?
                        <button onclick="navigateTo('login-empresa.html')" class="text-orange-500 hover:text-orange-600 font-medium">
                            Faça login
                        </button>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts/auth.js"></script>
    <script src="scripts/main.js"></script>
    <script src="scripts/ibge.js"></script>
    <script>
        // 1. Inicia o IBGE ao abrir a página
    document.addEventListener('DOMContentLoaded', () => {
        carregarEstados('ufCadastro');
    });
        document.getElementById('cadastroForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                showToast('As senhas não coincidem', 'error');
                return;
            }
            
            const userData = {
                razaoSocial: document.getElementById('razaoSocial').value,
                cnpj: document.getElementById('cnpj').value,
                email: document.getElementById('email').value,
                telefone: document.getElementById('telefone').value,
                endereco: document.getElementById('endereco').value,
                cidade: document.getElementById('cidadeCadastro').value,
                estado: document.getElementById('ufCadastro').value,
                password: document.getElementById('password').value, // <--- O Backend precisa disso!
    
                cadastroDate: new Date().toISOString()
            };
            
            registerUser('empresa', userData);
        });
    </script>
</body>
</html>
