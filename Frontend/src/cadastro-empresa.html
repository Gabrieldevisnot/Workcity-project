<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Empresa - WorkCity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles/main.css">

    <script>tailwind.config = { darkMode: 'class' }</script>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && systemTheme)) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
        })();
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-200 py-12 px-4">
    
    <div class="max-w-3xl mx-auto">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Cadastro de Empresa</h1>
            <p class="text-gray-600 dark:text-gray-400 mt-2">Crie sua conta para publicar vagas.</p>
        </div>

        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-8 border border-gray-200 dark:border-gray-700 transition-colors">
            <form id="cadastroForm" class="space-y-6">
                
                <!-- Dados Principais -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Razão Social *</label>
                    <input type="text" id="razaoSocial" required class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-orange-500 outline-none">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">CNPJ *</label>
                        <input type="text" id="cnpj" required class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-orange-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Telefone *</label>
                        <input type="tel" id="telefone" required class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-orange-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">E-mail Corporativo *</label>
                    <input type="email" id="email" required class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-orange-500 outline-none">
                </div>

                <!-- Endereço IBGE -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Endereço Completo</label>
                    <input type="text" id="endereco" required class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-orange-500 outline-none mb-4">
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Estado *</label>
                            <select id="ufCadastro" required class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-orange-500 outline-none" onchange="carregarCidades('ufCadastro', 'listaCidadesCadastro', 'cidadeCadastro')">
                                <option value="">UF</option>
                            </select>
                        </div>
                        <div class="md:col-span-2 relative">
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Cidade *</label>
                            <input type="text" id="cidadeCadastro" list="listaCidadesCadastro" required disabled placeholder="Selecione o Estado..." class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md dark:bg-gray-700 dark:text-white disabled:bg-gray-100 dark:disabled:bg-gray-800 focus:ring-2 focus:ring-orange-500 outline-none">
                            <datalist id="listaCidadesCadastro"></datalist>
                        </div>
                    </div>
                </div>

                <!-- Senha -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 border-t border-gray-200 dark:border-gray-600 pt-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Senha *</label>
                        <input type="password" id="password" required class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-orange-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Confirmar Senha *</label>
                        <input type="password" id="confirmPassword" required class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-orange-500 outline-none">
                    </div>
                </div>

                <button type="submit" class="w-full py-3 bg-orange-500 hover:bg-orange-600 text-white rounded-md font-bold transition shadow-md mt-6">
                    Criar Conta
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-gray-600 dark:text-gray-400">
                    Já tem uma conta? <a href="login-empresa.html" class="text-orange-600 dark:text-orange-400 font-medium hover:underline">Faça login</a>
                </p>
            </div>
        </div>
    </div>

    <script src="scripts/auth.js"></script>
    <script src="scripts/ibge.js"></script>
    <script src="scripts/main.js"></script> 
    <script>
        // Iniciar IBGE
        document.addEventListener('DOMContentLoaded', () => {
            carregarEstados('ufCadastro');
        });

        document.getElementById('cadastroForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                alert('As senhas não coincidem');
                return;
            }
            
            const userData = {
                razaoSocial: document.getElementById('razaoSocial').value,
                cnpj: document.getElementById('cnpj').value,
                email: document.getElementById('email').value,
                telefone: document.getElementById('telefone').value,
                endereco: document.getElementById('endereco').value,
                cidade: document.getElementById('cidadeCadastro').value,
                password: password,
                cadastroDate: new Date().toISOString()
            };
            
            registerUser('empresa', userData);
        });
    </script>
</body>
</html>
