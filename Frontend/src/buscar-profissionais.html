<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Talentos - WorkCity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <div class="min-h-screen py-8 px-4">
        <div class="max-w-6xl mx-auto">
            <div class="mb-8">
                <button onclick="window.location.href='empresa-dashboard.html'" class="text-gray-600 hover:text-orange-500 mb-4 flex items-center gap-2">
                    <i class="fas fa-arrow-left"></i> Voltar ao Dashboard
                </button>
                <h1 class="text-3xl font-bold text-gray-900">Encontrar Profissionais</h1>
                <p class="text-gray-600">Busque talentos e convide-os para suas vagas abertas.</p>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-sm mb-8">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="filtroNome" oninput="buscarProfissionais()" placeholder="Nome do profissional..." class="w-full px-4 py-2 border border-gray-300 rounded-md">
                    
                    <select id="filtroEspecialidade" onchange="buscarProfissionais()" class="w-full px-4 py-2 border border-gray-300 rounded-md">
                        <option value="">Todas as especialidades</option>
                        <option value="pedreiro">Pedreiro</option>
                        <option value="eletricista">Eletricista</option>
                        <option value="pintor">Pintor</option>
                        <option value="encanador">Encanador</option>
                    </select>

                    <input type="text" id="filtroCidade" oninput="buscarProfissionais()" placeholder="Cidade (ex: SP)" class="w-full px-4 py-2 border border-gray-300 rounded-md">
                </div>
            </div>

            <div id="listaProfissionais" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full text-center py-12 text-gray-500">Carregando talentos...</div>
            </div>
        </div>
    </div>

    <div id="modalConvite" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-8 w-full max-w-md mx-4 shadow-xl transform transition-all">
            <h2 class="text-xl font-bold mb-4">Convidar Profissional</h2>
            <p class="text-gray-600 mb-4">Selecione uma das suas vagas para enviar uma proposta para <strong id="nomeProfissionalModal"></strong>.</p>
            
            <form id="formConvite" class="space-y-4">
                <input type="hidden" id="profissionalIdModal">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Vaga *</label>
                    <select id="selectVagasEmpresa" required class="w-full px-4 py-2 border border-gray-300 rounded-md">
                        <option value="">Carregando suas vagas...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Mensagem (Opcional)</label>
                    <textarea id="mensagemConvite" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-md" placeholder="Olá, gostei do seu perfil..."></textarea>
                </div>

                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="fecharModal()" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-orange-500 hover:bg-orange-600 text-white rounded-md">Enviar Convite</button>
                </div>
            </form>
        </div>
    </div>

    <script src="scripts/auth.js"></script>
    <script src="scripts/main.js"></script>
    <script>
        requireAuth('empresa');

        // 1. BUSCAR PROFISSIONAIS
        async function buscarProfissionais() {
            const container = document.getElementById('listaProfissionais');
            const token = JSON.parse(localStorage.getItem('token'));
            
            const nome = document.getElementById('filtroNome').value;
            const esp = document.getElementById('filtroEspecialidade').value;
            const cidade = document.getElementById('filtroCidade').value;

            const params = new URLSearchParams();
            if(nome) params.append('busca', nome);
            if(esp) params.append('especialidade', esp);
            if(cidade) params.append('cidade', cidade);

            try {
                const response = await fetch(`${API_URL}/profissionais?${params.toString()}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const profissionais = await response.json();

                if (profissionais.length === 0) {
                    container.innerHTML = `<div class="col-span-full text-center py-12 bg-white rounded-lg text-gray-500">Nenhum profissional encontrado.</div>`;
                    return;
                }

                container.innerHTML = profissionais.map(p => `
                    <div class="bg-white border border-gray-200 rounded-lg p-6 hover:shadow-md transition-shadow flex flex-col items-center text-center">
                        <div class="w-20 h-20 bg-orange-100 rounded-full flex items-center justify-center text-orange-600 font-bold text-2xl mb-4">
                            ${p.name.charAt(0)}
                        </div>
                        <h3 class="text-lg font-bold text-gray-900">${p.name}</h3>
                        <p class="text-orange-600 font-medium mb-2">${p.specialty || 'Geral'}</p>
                        
                        <div class="text-sm text-gray-500 mb-4 space-y-1">
                            <p><i class="fas fa-map-marker-alt mr-1"></i> ${p.city || 'Local não informado'}</p>
                            <p><i class="fas fa-briefcase mr-1"></i> ${p.experience_years || 0} anos de experiência</p>
                        </div>

                        <button onclick="abrirModal('${p.id}', '${p.name}')" class="w-full px-4 py-2 bg-orange-500 hover:bg-orange-600 text-white rounded-md transition mt-auto">
                            Convidar para Vaga
                        </button>
                    </div>
                `).join('');

            } catch (error) {
                console.error(error);
                container.innerHTML = `<div class="col-span-full text-center text-red-500">Erro ao carregar profissionais.</div>`;
            }
        }

        // 2. CARREGAR VAGAS DA EMPRESA (Para preencher o select do modal)
        async function carregarMinhasVagas() {
            const select = document.getElementById('selectVagasEmpresa');
            const token = JSON.parse(localStorage.getItem('token'));

            try {
                // Reusamos a rota que já criamos antes!
                const response = await fetch(`${API_URL}/minhas-vagas`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const vagas = await response.json();
                
                // Filtra apenas vagas abertas
                const vagasAbertas = vagas.filter(v => v.status === 'aberta');

                if (vagasAbertas.length === 0) {
                    select.innerHTML = '<option value="">Você não tem vagas abertas</option>';
                    select.disabled = true;
                    return;
                }

                select.innerHTML = '<option value="">Selecione uma vaga...</option>' + 
                    vagasAbertas.map(v => `<option value="${v.id}">${v.titulo}</option>`).join('');
                select.disabled = false;

            } catch (error) {
                console.error(error);
                select.innerHTML = '<option>Erro ao carregar vagas</option>';
            }
        }

        // 3. LÓGICA DO MODAL
        function abrirModal(id, nome) {
            document.getElementById('profissionalIdModal').value = id;
            document.getElementById('nomeProfissionalModal').textContent = nome;
            document.getElementById('modalConvite').classList.remove('hidden');
            
            // Carrega as vagas sempre que abrir para garantir dados frescos
            carregarMinhasVagas();
        }

        function fecharModal() {
            document.getElementById('modalConvite').classList.add('hidden');
        }

        // 4. ENVIAR CONVITE (SUBMIT)
        document.getElementById('formConvite').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const token = JSON.parse(localStorage.getItem('token'));
            const profissionalId = document.getElementById('profissionalIdModal').value;
            const vagaId = document.getElementById('selectVagasEmpresa').value;
            const mensagem = document.getElementById('mensagemConvite').value;

            if(!vagaId) return alert("Selecione uma vaga!");

            const btn = e.target.querySelector('button[type="submit"]');
            const textoOriginal = btn.innerText;
            btn.innerText = "Enviando...";
            btn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/convites`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ profissionalId, vagaId, mensagem })
                });

                const data = await response.json();

                if (response.ok) {
                    alert("Convite enviado com sucesso! 🎉");
                    fecharModal();
                } else {
                    alert(data.message);
                }

            } catch (error) {
                console.error(error);
                alert("Erro de conexão.");
            } finally {
                btn.innerText = textoOriginal;
                btn.disabled = false;
            }
        });

        // Inicializa
        buscarProfissionais();
    </script>
</body>
</html>
