<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Empresa - WorkCity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center px-4 py-12">
        <div class="max-w-md w-full">
            <div class="text-center mb-8">
                <div class="flex items-center justify-center mb-4">
                    <i class="fas fa-building text-orange-500 text-4xl"></i>
                </div>
                <h1 class="text-3xl font-bold text-gray-900">Login Empresa</h1>
                <p class="text-gray-600 mt-2">Acesse sua conta e encontre profissionais qualificados</p>
            </div>

            <div class="bg-white rounded-lg shadow-md p-8">
                <form id="loginForm" class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                            E-mail Corporativo
                        </label>
                        <input
                            type="email"
                            id="email"
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-orange-500 focus:border-transparent"
                            placeholder="empresa@email.com"
                        >
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                            Senha
                        </label>
                        <input
                            type="password"
                            id="password"
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-orange-500 focus:border-transparent"
                            placeholder="••••••••"
                        >
                    </div>

                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <input
                                type="checkbox"
                                id="remember"
                                class="h-4 w-4 text-orange-500 focus:ring-orange-500 border-gray-300 rounded"
                            >
                            <label for="remember" class="ml-2 block text-sm text-gray-700">
                                Lembrar-me
                            </label>
                        </div>
                        <button type="button" class="text-sm text-orange-500 hover:text-orange-600">
                            Esqueci minha senha
                        </button>
                    </div>

                    <button
                        type="submit"
                        class="w-full py-3 bg-orange-500 hover:bg-orange-600 text-white rounded-md font-medium transition"
                    >
                        Entrar
                    </button>
                </form>

                <div class="mt-6 text-center">
                    <p class="text-gray-600">
                        Não tem uma conta?
                        <button onclick="navigateTo('cadastro-empresa.html')" class="text-orange-500 hover:text-orange-600 font-medium">
                            Cadastre sua empresa
                        </button>
                    </p>
                </div>

                <div class="mt-6">
                    <button onclick="navigateTo('index.html')" class="w-full py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition">
                        <i class="fas fa-arrow-left mr-2"></i>
                        Voltar para Início
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts/auth.js"></script>
    <script src="scripts/main.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Validação básica
            if (!validateEmail(email)) {
                showToast('E-mail inválido', 'error');
                return;
            }
            
            // if (password.length < 6) {
            //     showToast('Senha deve ter no mínimo 6 caracteres', 'error');
            //     return;
            // }
            
            // Simular login bem-sucedido
            // const userData = {
            //     email: email,
            //     nome: 'Construtora ABC',
            //     cnpj: '12.345.678/0001-90',
            //     loginDate: new Date().toISOString()
            // };
            
            // loginUser('empresa', userData);
            loginUser(email, password);
        });
    </script>
</body>
</html>
