<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Empresa - WorkCity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles/main.css">

    <script>tailwind.config = { darkMode: 'class' }</script>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && systemTheme)) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
        })();
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-200 flex items-center justify-center min-h-screen px-4">
    
    <!-- Botão Voltar -->
    <a href="index.html" class="absolute top-6 left-6 text-gray-600 dark:text-gray-400 hover:text-orange-500 transition flex items-center gap-2">
        <i class="fas fa-arrow-left"></i> Home
    </a>

    <!-- Botão Tema (Absolute) -->
    <div class="absolute top-6 right-6">
        <button onclick="toggleTheme()" class="p-2 rounded-full bg-white dark:bg-gray-800 shadow-sm text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
            <i class="fas fa-adjust"></i>
        </button>
    </div>

    <div class="w-full max-w-md">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-8 border border-gray-200 dark:border-gray-700 transition-colors">
            <div class="text-center mb-8">
                <i class="fas fa-building text-4xl text-orange-500 mb-4"></i>
                <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Área da Empresa</h2>
                <p class="text-gray-600 dark:text-gray-400">Faça login para gerenciar suas vagas.</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">E-mail Corporativo</label>
                    <input type="email" id="email" required class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:ring-2 focus:ring-orange-500 dark:bg-gray-700 dark:text-white outline-none transition-colors">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Senha</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:ring-2 focus:ring-orange-500 dark:bg-gray-700 dark:text-white outline-none transition-colors">
                </div>

                <!-- CAMPO LEMBRAR-ME ADICIONADO -->
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input id="remember" name="remember" type="checkbox" class="h-4 w-4 text-orange-600 focus:ring-orange-500 border-gray-300 rounded">
                        <label for="remember" class="ml-2 block text-sm text-gray-700 dark:text-gray-300">
                            Lembrar-me
                        </label>
                    </div>
                    <div class="text-sm">
                        <a href="#" class="font-medium text-orange-600 hover:text-orange-500">Esqueceu a senha?</a>
                    </div>
                </div>

                <button type="submit" class="w-full py-3 bg-orange-500 hover:bg-orange-600 text-white rounded-md font-bold transition shadow-sm">
                    Entrar
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-gray-600 dark:text-gray-400">
                Não tem uma conta? 
                <a href="cadastro-empresa.html" class="text-orange-600 dark:text-orange-400 font-medium hover:underline">Cadastre-se</a>
            </div>
        </div>
    </div>

    <script src="scripts/auth.js"></script>
    <script>
        function toggleTheme() {
            const root = document.documentElement;
            if (root.classList.contains('dark')) {
                root.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                root.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        // LÓGICA DO LEMBRAR-ME
        // 1. Ao carregar a página, verifica se existe um email salvo
        document.addEventListener('DOMContentLoaded', () => {
            const savedEmail = localStorage.getItem('workcity_remember_email');
            if (savedEmail) {
                document.getElementById('email').value = savedEmail;
                document.getElementById('remember').checked = true;
            }
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            // 2. Se "Lembrar-me" estiver marcado, salvamos o email. Se não, removemos.
            if (remember) {
                localStorage.setItem('workcity_remember_email', email);
            } else {
                localStorage.removeItem('workcity_remember_email');
            }

            loginUser(email, password); 
        });
    </script>
</body>
</html>
