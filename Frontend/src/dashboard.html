<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Profissional - WorkCity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 px-4 py-3 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <button onclick="navigateToHome()">
                    <div class="flex items-center space-x-2">
                        <i class="fas fa-building text-orange-500 text-3xl"></i>
                        <div>
                            <h3 class="text-xl font-bold text-gray-900">WorkCity</h3>
                            <p class="text-sm text-gray-500">Área do Profissional</p>
                        </div>
                    </div>
                </button>
            </div>
            
            <div id="headerActions" class="flex items-center space-x-3">
                <!-- Preenchido pelo auth.js -->
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="min-h-screen py-8 px-4">
        <div class="max-w-7xl mx-auto">
            
            <!-- Topo: Boas Vindas e Foto -->
            <div class="flex items-center gap-4 mb-8">
                <div class="w-16 h-16 bg-orange-100 rounded-full flex items-center justify-center text-orange-600 font-bold text-2xl overflow-hidden border-2 border-white shadow-sm relative">
                    <!-- Foto de Perfil -->
                    <img id="headerAvatar" src="" class="w-full h-full object-cover hidden">
                    <span id="headerInicial">U</span>
                </div>
                <div>
                    <h1 class="text-3xl font-bold text-gray-900" id="headerNome">Olá, Profissional</h1>
                    <p class="text-gray-600">Gerencie sua carreira e oportunidades.</p>
                </div>
            </div>

            <!-- Cards Stats -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                <div class="bg-white rounded-lg shadow-sm p-4 text-center border-b-4 border-orange-500">
                    <div class="text-3xl font-bold text-orange-500" id="statsVagasDisponiveis">...</div>
                    <div class="text-sm text-gray-600 font-medium">Vagas no Feed</div>
                </div>
                <div class="bg-white rounded-lg shadow-sm p-4 text-center border-b-4 border-purple-500 relative">
                    <div class="text-3xl font-bold text-purple-600" id="statsPropostas">0</div>
                    <div class="text-sm text-gray-600 font-medium">Propostas</div>
                    <span id="badgePropostas" class="absolute top-2 right-2 h-3 w-3 bg-red-500 rounded-full hidden"></span>
                </div>
                <div class="bg-white rounded-lg shadow-sm p-4 text-center border-b-4 border-blue-500">
                    <div class="text-3xl font-bold text-blue-500" id="statsCandidaturas">...</div>
                    <div class="text-sm text-gray-600 font-medium">Candidaturas</div>
                </div>
                <div class="bg-white rounded-lg shadow-sm p-4 text-center border-b-4 border-yellow-400">
                    <div class="text-3xl font-bold text-yellow-500">5.0 <span class="text-sm">⭐</span></div>
                    <div class="text-sm text-gray-600 font-medium">Reputação</div>
                </div>
            </div>

            <!-- Navegação de Abas -->
            <div class="bg-white rounded-t-lg shadow-sm border-b border-gray-200">
                <nav class="flex -mb-px overflow-x-auto">
                    <button onclick="switchTab('vagas')" id="tabVagas" class="whitespace-nowrap px-6 py-4 border-b-2 border-orange-500 text-orange-600 font-bold text-sm transition-colors">
                        <i class="fas fa-search mr-2"></i> Buscar Vagas
                    </button>
                    <button onclick="switchTab('propostas')" id="tabPropostas" class="whitespace-nowrap px-6 py-4 border-b-2 border-transparent text-gray-500 hover:text-gray-700 font-medium text-sm transition-colors">
                        <i class="fas fa-envelope-open-text mr-2"></i> Propostas
                    </button>
                    <button onclick="switchTab('candidaturas')" id="tabCandidaturas" class="whitespace-nowrap px-6 py-4 border-b-2 border-transparent text-gray-500 hover:text-gray-700 font-medium text-sm transition-colors">
                        <i class="fas fa-briefcase mr-2"></i> Minhas Candidaturas
                    </button>
                    <button onclick="switchTab('perfil')" id="tabPerfil" class="whitespace-nowrap px-6 py-4 border-b-2 border-transparent text-gray-500 hover:text-gray-700 font-medium text-sm transition-colors">
                        <i class="fas fa-user-circle mr-2"></i> Meu Perfil
                    </button>
                </nav>
            </div>

            <!-- CONTEÚDO DAS ABAS -->
            <div class="bg-white rounded-b-lg shadow-sm min-h-[400px]">
                
                <!-- 1. ABA: BUSCAR VAGAS -->
                <div id="contentVagas" class="p-6">
                    <h2 class="text-lg font-semibold text-gray-800 mb-4">Filtrar Oportunidades</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8 bg-gray-50 p-4 rounded-lg border border-gray-200">
                        <div>
                            <label class="text-xs font-bold text-gray-500 uppercase mb-1 block">Busca</label>
                            <input type="text" id="filtroBusca" oninput="carregarFeed()" placeholder="Título..." class="w-full px-4 py-2 border border-gray-300 rounded-md outline-none focus:ring-2 focus:ring-orange-500">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-500 uppercase mb-1 block">Especialidade</label>
                            <select id="filtroEspecialidade" onchange="carregarFeed()" class="w-full px-4 py-2 border border-gray-300 rounded-md outline-none focus:ring-2 focus:ring-orange-500 bg-white">
                                <option value="">Todas</option>
                                <option value="pedreiro">Pedreiro</option>
                                <option value="eletricista">Eletricista</option>
                                <option value="pintor">Pintor</option>
                                <option value="encanador">Encanador</option>
                                <option value="carpinteiro">Carpinteiro</option>
                                <option value="serralheiro">Serralheiro</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-500 uppercase mb-1 block">Localização</label>
                            <div class="flex gap-2">
                                <select id="filtroUF" class="w-20 px-2 py-2 border border-gray-300 rounded-md text-center font-bold text-gray-700 focus:ring-2 focus:ring-orange-500 outline-none" onchange="carregarCidades('filtroUF', 'listaCidadesBusca', 'filtroCidade')">
                                    <option value="">UF</option>
                                </select>
                                <div class="flex-1 relative">
                                    <input 
                                        type="text" 
                                        id="filtroCidade" 
                                        list="listaCidadesBusca" 
                                        placeholder="Cidade..." 
                                        disabled
                                        onchange="carregarFeed()" 
                                        class="w-full px-4 py-2 border border-gray-300 rounded-md bg-white disabled:bg-gray-100 focus:ring-2 focus:ring-orange-500 outline-none"
                                    >
                                    <datalist id="listaCidadesBusca"></datalist>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="feedVagas" class="space-y-4">
                        <div class="text-center text-gray-400 py-12">
                            <i class="fas fa-spinner fa-spin text-3xl mb-2"></i>
                            <p>Carregando...</p>
                        </div>
                    </div>
                </div>

                <!-- 2. ABA: PROPOSTAS -->
                <div id="contentPropostas" class="p-6 hidden">
                    <h2 class="text-lg font-semibold text-gray-800 mb-4">Propostas de Trabalho</h2>
                    <div id="listaPropostas" class="space-y-4"></div>
                </div>

                <!-- 3. ABA: MINHAS CANDIDATURAS -->
                <div id="contentCandidaturas" class="p-6 hidden">
                    <h2 class="text-lg font-semibold text-gray-800 mb-4">Histórico de Candidaturas</h2>
                    <div id="listaCandidaturas" class="space-y-4"></div>
                </div>

                <!-- 4. ABA: MEU PERFIL (FINALMENTE COMPLETA!) -->
                <div id="contentPerfil" class="p-6 hidden">
                    <div class="max-w-3xl mx-auto">
                        <div class="flex items-center justify-between mb-6">
                            <h2 class="text-xl font-bold text-gray-900">Editar Perfil</h2>
                            <button onclick="salvarPerfil()" class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-md font-medium shadow-sm transition flex items-center gap-2">
                                <i class="fas fa-save"></i> Salvar Alterações
                            </button>
                        </div>

                        <form id="formPerfil" class="space-y-6 bg-gray-50 p-6 rounded-lg border border-gray-200">
                            <!-- Dados Pessoais -->
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Nome Completo</label>
                                    <input type="text" id="perfilNome" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-orange-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">E-mail (Não editável)</label>
                                    <input type="email" id="perfilEmail" disabled class="w-full px-4 py-2 border border-gray-300 rounded-md bg-gray-200 cursor-not-allowed">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Telefone / WhatsApp</label>
                                    <input type="tel" id="perfilTelefone" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-orange-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Link da Foto (URL)</label>
                                    <input type="url" id="perfilAvatar" placeholder="https://..." class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-orange-500">
                                </div>
                            </div>

                            <!-- Profissional -->
                            <div class="border-t border-gray-200 pt-6">
                                <h3 class="text-lg font-medium text-gray-900 mb-4">Dados Profissionais</h3>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Especialidade Principal</label>
                                        <select id="perfilEspecialidade" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-orange-500">
                                            <option value="pedreiro">Pedreiro</option>
                                            <option value="eletricista">Eletricista</option>
                                            <option value="pintor">Pintor</option>
                                            <option value="encanador">Encanador</option>
                                            <option value="carpinteiro">Carpinteiro</option>
                                            <option value="serralheiro">Serralheiro</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Anos de Experiência</label>
                                        <input type="number" id="perfilExperiencia" min="0" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-orange-500">
                                    </div>
                                </div>
                            </div>

                            <!-- Localização (IBGE Integrado) -->
                            <div class="border-t border-gray-200 pt-6">
                                <h3 class="text-lg font-medium text-gray-900 mb-4">Localização</h3>
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
                                        <select id="ufPerfil" class="w-full px-4 py-2 border border-gray-300 rounded-md" onchange="carregarCidades('ufPerfil', 'listaCidadesPerfil', 'cidadePerfil')">
                                            <option value="">UF</option>
                                        </select>
                                    </div>
                                    <div class="md:col-span-2 relative">
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Cidade</label>
                                        <input type="text" id="cidadePerfil" list="listaCidadesPerfil" placeholder="Selecione o Estado..." disabled class="w-full px-4 py-2 border border-gray-300 rounded-md bg-white disabled:bg-gray-100">
                                        <datalist id="listaCidadesPerfil"></datalist>
                                    </div>
                                </div>
                            </div>

                            <!-- Bio -->
                            <div class="border-t border-gray-200 pt-6">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Sobre Mim (Bio)</label>
                                <textarea id="perfilBio" rows="4" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-orange-500" placeholder="Conte um pouco sobre sua experiência..."></textarea>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="scripts/auth.js"></script>
    <script src="scripts/main.js"></script>
    <script src="scripts/ibge.js"></script>

    <script>
        // --- INICIALIZAÇÃO ---
        requireAuth('profissional');
        updateHeaderForLoggedUser();

        document.addEventListener('DOMContentLoaded', () => {
            carregarEstados('filtroUF'); // Filtro Vagas
            carregarEstados('ufPerfil'); // Filtro Perfil (NOVO)
            
            carregarFeed();
            carregarPropostas();
            carregarMinhasCandidaturas();
            carregarPerfil(); // Carrega os dados do usuário (NOVO)
        });

        // --- NAVEGAÇÃO ---
        function switchTab(tab) {
            const tabs = ['vagas', 'propostas', 'candidaturas', 'perfil'];
            tabs.forEach(t => {
                const btn = document.getElementById(`tab${t.charAt(0).toUpperCase() + t.slice(1)}`);
                const content = document.getElementById(`content${t.charAt(0).toUpperCase() + t.slice(1)}`);
                if (t === tab) {
                    btn.className = 'whitespace-nowrap px-6 py-4 border-b-2 border-orange-500 text-orange-600 font-bold text-sm transition-colors';
                    content.classList.remove('hidden');
                    if(tab === 'vagas') carregarFeed();
                    if(tab === 'propostas') carregarPropostas();
                    if(tab === 'candidaturas') carregarMinhasCandidaturas();
                    if(tab === 'perfil') carregarPerfil();
                } else {
                    btn.className = 'whitespace-nowrap px-6 py-4 border-b-2 border-transparent text-gray-500 hover:text-gray-700 font-medium text-sm transition-colors';
                    content.classList.add('hidden');
                }
            });
        }

        // --- FORMATADORES ---
        function formatarData(d) { 
            if(!d) return 'N/A';
            return new Date(d).toLocaleDateString('pt-BR');
        }
        function formatarSalario(min, max) {
            if (!min) return 'A combinar';
            const f = (v) => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
            return (min && max) ? `${f(min)} - ${f(max)}` : `A partir de ${f(min)}`;
        }

        // --- PERFIL (LÓGICA NOVA) ---
        async function carregarPerfil() {
            const token = JSON.parse(localStorage.getItem('token'));
            try {
                const response = await fetch(`${API_URL}/perfil`, { headers: { 'Authorization': `Bearer ${token}` }});
                const user = await response.json();

                if (response.ok) {
                    // Preenche campos
                    document.getElementById('perfilNome').value = user.name;
                    document.getElementById('perfilEmail').value = user.email;
                    document.getElementById('perfilTelefone').value = user.phone || '';
                    document.getElementById('perfilEspecialidade').value = user.specialty || 'pedreiro';
                    document.getElementById('perfilExperiencia').value = user.experience_years || 0;
                    document.getElementById('cidadePerfil').value = user.city || '';
                    document.getElementById('perfilBio').value = user.bio || '';
                    document.getElementById('perfilAvatar').value = user.avatar_url || '';

                    // Atualiza Header
                    document.getElementById('headerNome').textContent = `Olá, ${user.name.split(' ')[0]}`;
                    if (user.avatar_url) {
                        const img = document.getElementById('headerAvatar');
                        img.src = user.avatar_url;
                        img.classList.remove('hidden');
                        document.getElementById('headerInicial').classList.add('hidden');
                    }
                }
            } catch (error) { console.error("Erro perfil:", error); }
        }

        async function salvarPerfil() {
            const token = JSON.parse(localStorage.getItem('token'));
            const btn = event.target;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Salvando...';
            btn.disabled = true;

            const dados = {
                name: document.getElementById('perfilNome').value,
                phone: document.getElementById('perfilTelefone').value,
                specialty: document.getElementById('perfilEspecialidade').value,
                experience_years: document.getElementById('perfilExperiencia').value,
                city: document.getElementById('cidadePerfil').value,
                bio: document.getElementById('perfilBio').value,
                avatar_url: document.getElementById('perfilAvatar').value
            };

            try {
                const response = await fetch(`${API_URL}/perfil`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(dados)
                });

                if (response.ok) {
                    alert("Perfil atualizado com sucesso! ✅");
                    carregarPerfil(); // Atualiza visual
                } else {
                    alert("Erro ao salvar.");
                }
            } catch (error) { alert("Erro de conexão."); } 
            finally { btn.innerHTML = originalText; btn.disabled = false; }
        }

        // --- VAGAS, PROPOSTAS, CANDIDATURAS ---
        async function carregarFeed() {
            const container = document.getElementById('feedVagas');
            const token = JSON.parse(localStorage.getItem('token'));
            const params = new URLSearchParams();
            
            const busca = document.getElementById('filtroBusca').value;
            const esp = document.getElementById('filtroEspecialidade').value;
            const cid = document.getElementById('filtroCidade').value;
            
            if(busca) params.append('busca', busca);
            if(esp) params.append('especialidade', esp);
            if(cid) params.append('cidade', cid);

            try {
                const res = await fetch(`${API_URL}/vagas/feed?${params}`, { headers: { 'Authorization': `Bearer ${token}` }});
                const vagas = await res.json();
                
                if(!Array.isArray(vagas)) throw new Error();
                document.getElementById('statsVagasDisponiveis').textContent = vagas.length;

                container.innerHTML = vagas.length ? vagas.map(v => `
                    <div class="bg-white border border-gray-200 rounded-lg p-6 hover:shadow-md transition-all mb-4">
                        <div class="flex flex-col md:flex-row justify-between gap-4">
                            <div class="flex-1">
                                <h3 class="text-lg font-bold text-gray-900">${v.titulo}</h3>
                                <p class="text-sm text-orange-600 font-medium mb-2"><i class="fas fa-building"></i> ${v.nome_empresa}</p>
                                <div class="flex flex-wrap gap-4 text-sm text-gray-500 mb-2">
                                    <span><i class="fas fa-map-marker-alt"></i> ${v.localizacao}</span>
                                    <span class="text-green-600 font-bold"><i class="fas fa-wallet"></i> ${formatarSalario(v.salario_min, v.salario_max)}</span>
                                </div>
                                <p class="text-gray-600 text-sm mb-4 line-clamp-2">${v.descricao}</p>
                            </div>
                            <div>
                                <button onclick="candidatar(${v.id})" class="w-full md:w-auto px-6 py-2 bg-orange-500 hover:bg-orange-600 text-white rounded-md font-medium transition">
                                    Candidatar-se
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('') : '<div class="text-center py-12 text-gray-500">Nenhuma vaga encontrada.</div>';
            } catch(e) { container.innerHTML = '<p class="text-center text-red-500">Erro ao carregar.</p>'; }
        }

        async function carregarPropostas() {
            const container = document.getElementById('listaPropostas');
            const token = JSON.parse(localStorage.getItem('token'));
            try {
                const res = await fetch(`${API_URL}/minhas-propostas`, { headers: { 'Authorization': `Bearer ${token}` }});
                const props = await res.json();
                
                const pendentes = props.filter(p => p.status === 'enviado').length;
                document.getElementById('statsPropostas').textContent = pendentes;
                document.getElementById('badgePropostas').style.display = pendentes > 0 ? 'block' : 'none';

                container.innerHTML = props.length ? props.map(p => `
                    <div class="bg-white border p-6 rounded-lg mb-4 ${p.status === 'enviado' ? 'border-l-4 border-l-purple-500 shadow-md' : 'opacity-75'}">
                        <div class="flex justify-between items-center">
                            <div>
                                <h3 class="font-bold text-gray-900">Convite: ${p.titulo_vaga}</h3>
                                <p class="text-sm text-gray-600">${p.nome_empresa}</p>
                                <p class="text-xs text-gray-400 mt-1">Msg: "${p.mensagem || ''}"</p>
                            </div>
                            <div class="flex gap-2">
                                ${p.status === 'enviado' ? `
                                    <button onclick="responderProposta(${p.id}, ${p.vaga_id}, 'aceito')" class="px-3 py-1 bg-green-500 text-white rounded text-sm">Aceitar</button>
                                    <button onclick="responderProposta(${p.id}, ${p.vaga_id}, 'recusado')" class="px-3 py-1 border border-gray-300 rounded text-sm">Recusar</button>
                                ` : `<span class="text-xs font-bold uppercase px-2 py-1 bg-gray-100 rounded">${p.status}</span>`}
                            </div>
                        </div>
                    </div>
                `).join('') : '<div class="text-center py-12 text-gray-500">Sem propostas.</div>';
            } catch(e) {}
        }

        async function carregarMinhasCandidaturas() {
            const container = document.getElementById('listaCandidaturas');
            const token = JSON.parse(localStorage.getItem('token'));
            try {
                const res = await fetch(`${API_URL}/minhas-candidaturas`, { headers: { 'Authorization': `Bearer ${token}` }});
                const cands = await res.json();
                document.getElementById('statsCandidaturas').textContent = cands.length;
                
                container.innerHTML = cands.length ? cands.map(c => `
                    <div class="bg-white border p-6 rounded-lg mb-4 flex justify-between items-center" id="cand-${c.candidatura_id || c.id}">
                        <div>
                            <h3 class="font-bold text-gray-900">${c.titulo}</h3>
                            <p class="text-sm text-gray-600">${c.nome_empresa}</p>
                            <span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded mt-2 inline-block uppercase font-bold">${c.status}</span>
                        </div>
                        <button onclick="cancelarCandidatura(${c.candidatura_id || c.id})" class="text-red-500 text-sm hover:underline">Cancelar</button>
                    </div>
                `).join('') : '<div class="text-center py-12 text-gray-500">Sem candidaturas.</div>';
            } catch(e) {}
        }

        // --- AÇÕES ---
        async function candidatar(vagaId) {
            const token = JSON.parse(localStorage.getItem('token'));
            if(!confirm('Confirmar candidatura?')) return;
            try {
                const res = await fetch(`${API_URL}/candidaturas`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ vagaId }) });
                if(res.ok) { alert('Candidatura enviada!'); carregarFeed(); carregarMinhasCandidaturas(); }
                else { const d = await res.json(); alert(d.message); }
            } catch(e) { alert('Erro de conexão'); }
        }

        async function responderProposta(id, vid, status) {
            const token = JSON.parse(localStorage.getItem('token'));
            try {
                const res = await fetch(`${API_URL}/convites/${id}/responder`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ status, vagaId: vid }) });
                if(res.ok) { alert('Respondido!'); carregarPropostas(); carregarMinhasCandidaturas(); }
            } catch(e) { alert('Erro'); }
        }

        async function cancelarCandidatura(id) {
            const token = JSON.parse(localStorage.getItem('token'));
            if(!confirm('Cancelar?')) return;
            try {
                const res = await fetch(`${API_URL}/candidaturas/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
                if(res.ok) { 
                    const el = document.getElementById(`cand-${id}`);
                    if(el) el.remove(); 
                    carregarFeed(); 
                }
            } catch(e) {}
        }
    </script>
</body>
